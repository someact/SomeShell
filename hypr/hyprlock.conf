# Backup lock screen, used only when the shell is not running (scripts/lock.sh).
# The shell's style A "Headline" (SomeShell.md section 5) as far as hyprlock
# goes: the time up the left edge, small spaced capitals, the password on a
# hairline, the seconds in a thin circle. No barcode, no player. Always the
# dark palette (matugen writes it); sizes are drawn for 1920x1080.

$paper = rgba(131313ff)
$ink = rgba(e2e2e2ff)
$mute = rgba(c6c6c6ff)
$line = rgba(474747ff)
$error = rgba(ffb4abff)
source = ~/.config/hypr/generated/hyprlock-palette.conf
$font = Mitr
$info = ~/.config/hypr/scripts/lockinfo.sh
# Left edge of the text column (right of the clock)
$col = 394

general {
    hide_cursor = false
}

background {
    monitor =
    color = $paper
}

label { # The time, up the left edge
    monitor =
    text = $TIME
    color = $ink
    font_size = 236
    font_family = $font SemiBold
    rotate = 90
    position = -96, 0
    halign = left
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:60000] $info date
    color = $mute
    font_size = 11
    font_family = $font
    position = $col, -128
    halign = left
    valign = top
}

label { # Top right: when it locked
    monitor =
    text = cmd[update:0] $info locked
    color = $ink
    font_size = 11
    font_family = $font
    position = -144, -128
    halign = right
    valign = top
}

label { # Name
    monitor =
    text = cmd[update:0] $info who
    color = $ink
    font_size = 38
    font_family = $font Medium
    position = $col, 118
    halign = left
    valign = center
}

label { # Host
    monitor =
    text = cmd[update:0] $info host
    color = $mute
    font_size = 11
    font_family = $font
    position = $col, 62
    halign = left
    valign = center
}

label {
    monitor =
    text = <span letter_spacing="2600">PASSWORD</span>
    color = $mute
    font_size = 11
    font_family = $font
    position = $col, 0
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 576, 42
    rounding = 0
    outline_thickness = 0
    dots_size = 0.34
    dots_spacing = 0.9
    dots_center = false
    dots_rounding = -1
    outer_color = $paper
    inner_color = $paper
    font_color = $ink
    check_color = $paper
    fail_color = $paper
    capslock_color = $paper
    font_family = $font
    placeholder_text =
    fail_text = <span foreground="##ffb4ab" letter_spacing="2600">WRONG · TRY AGAIN · $ATTEMPTS</span>
    fade_on_empty = false
    position = $col, -46
    halign = left
    valign = center
}

shape { # The hairline under the dots
    monitor =
    size = 576, 1
    color = $ink
    rounding = 0
    position = $col, -72
    halign = left
    valign = center
}

label { # Caption
    monitor =
    text = cmd[update:2000] $info layout "ENTER TO UNLOCK · "
    color = $mute
    font_size = 11
    font_family = $font
    position = $col, -104
    halign = left
    valign = center
}

shape { # Seconds: a thin circle
    monitor =
    size = 380, 380
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = $ink
    position = 480, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%S
    color = $ink
    font_size = 54
    font_family = $font SemiBold
    position = 480, 14
    halign = center
    valign = center
}

label {
    monitor =
    text = <span letter_spacing="2200">SECONDS</span>
    color = $mute
    font_size = 9
    font_family = $font
    position = 480, -42
    halign = center
    valign = center
}

label { # Bottom left: status lines
    monitor =
    text = cmd[update:10000] $info status
    color = $ink
    font_size = 11
    font_family = $font
    position = $col, 152
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] $info layout "KEYBOARD " "."
    color = $mute
    font_size = 11
    font_family = $font
    position = $col, 122
    halign = left
    valign = bottom
}

label { # Print marks
    monitor =
    text = +
    color = $mute
    font_size = 22
    font_family = $font Light
    position = -48, -44
    halign = right
    valign = top
}

label {
    monitor =
    text = +
    color = $mute
    font_size = 22
    font_family = $font Light
    position = -48, 40
    halign = right
    valign = bottom
}
