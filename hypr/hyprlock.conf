# Backup lock screen, used only when the shell is not running (scripts/lock.sh).
# Poster style: a big clock, small spaced labels, a plain password field.
# Neutral colors until matugen writes its own (step 2 adds them here).

$paper = rgba(101114ff)
$ink = rgba(e8e8ecff)
$mute = rgba(8d8f95ff)
$accent = rgba(c4c6ccff)
$font = Mitr

general {
    hide_cursor = true
}

background {
    monitor =
    color = $paper
}

label { # Clock
    monitor =
    text = $TIME
    color = $ink
    font_size = 120
    font_family = $font SemiBold
    position = 0, 160
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%a %d %b" | tr a-z A-Z
    color = $mute
    font_size = 14
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    rounding = -1
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    outer_color = $mute
    inner_color = $paper
    font_color = $ink
    check_color = $accent
    fail_color = rgba(ff5a4eff)
    capslock_color = $accent
    font_family = $font
    placeholder_text = PASSWORD
    fail_text = WRONG PASSWORD
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label { # Keyboard layout
    monitor =
    text = $LAYOUT
    color = $mute
    font_size = 12
    font_family = $font
    position = -32, 28
    halign = right
    valign = bottom
}
