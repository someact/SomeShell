[config]
version_check = false

# Fixed palette blended toward the wallpaper; feeds the 16 terminal colors and
# KDE's positive/negative colors. Templates read e.g. {{colors.term_red.default.hex}}.
[config.custom_colors]
term_red = { color = "#CC241D", blend = true }
term_green = { color = "#98971A", blend = true }
term_yellow = { color = "#D79921", blend = true }
term_blue = { color = "#458588", blend = true }
term_magenta = { color = "#B16286", blend = true }
term_cyan = { color = "#689D6A", blend = true }

# --- SomeShell shell -----------------------------------------------------------
[templates.shell]
input_path = '~/.config/matugen/templates/shell-colors.json'
output_path = '~/.local/state/someshell/colors.json'

# --- Hyprland -----------------------------------------------------------------
[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/generated/colors.lua'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/generated/hyprlock-colors.conf'

# --- Terminals (kitty includes the theme; other terminals get OSC sequences) ---
[templates.kitty]
input_path = '~/.config/matugen/templates/terminal/kitty-theme.conf'
output_path = '~/.local/state/someshell/kitty-theme.conf'

[templates.term_sequences]
input_path = '~/.config/matugen/templates/terminal/sequences.txt'
output_path = '~/.local/state/someshell/sequences.txt'
post_hook = '~/.config/matugen/hooks/term-sequences.sh &'

# --- GTK / Qt / KDE -----------------------------------------------------------
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
post_hook = 'gsettings set org.gnome.desktop.interface color-scheme prefer-{{mode}}'

[templates.kde]
input_path = '~/.config/matugen/templates/kde/SomeShell.colors'
output_path = '~/.local/share/color-schemes/SomeShell.colors'
post_hook = '~/.config/matugen/hooks/kde-colors.sh &'

# --- Apps ---------------------------------------------------------------------
[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.zen]
input_path = '~/.config/matugen/templates/zen/someshell-colors.css'
output_path = '~/.local/state/someshell/zen-colors.css'
post_hook = '~/.config/matugen/hooks/zen-colors.sh &'

[templates.vesktop]
input_path = '~/.config/matugen/templates/vesktop/someshell.theme.css'
output_path = '~/.config/vesktop/themes/someshell.theme.css'
