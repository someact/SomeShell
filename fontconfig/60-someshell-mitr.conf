<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SomeShell: Google's static Mitr files carry a second family name per weight
     ("Mitr Light", "Mitr Medium", "Mitr SemiBold") with the style "Regular",
     which makes Qt pick SemiBold for every weight. Keep only "Mitr" and the real style. -->
<fontconfig>
  <match target="scan">
    <test name="family"><string>Mitr Light</string></test>
    <edit name="family" mode="assign" binding="same"><string>Mitr</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Light</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Mitr Medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>Mitr</string></edit>
    <edit name="style" mode="assign" binding="same"><string>Medium</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Mitr SemiBold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Mitr</string></edit>
    <edit name="style" mode="assign" binding="same"><string>SemiBold</string></edit>
  </match>
</fontconfig>
