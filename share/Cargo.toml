[package]
name = "someshell-share"
version = "0.1.0"
edition = "2021"
description = "Quick Share for SomeShell: Google's Quick Share protocol on the local network (rqs_lib), Bluetooth file push (OBEX) through bluez's obexd as the fallback, and bluez's pairing agent"
license = "GPL-3.0-only"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
# Google's Quick Share protocol (rquickshare's core, GPL-3.0), pinned
rqs_lib = { git = "https://github.com/Martichou/rquickshare", rev = "378d8ae" }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
