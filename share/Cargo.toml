[package]
name = "someshell-share"
version = "0.1.0"
edition = "2021"
description = "Quick Share for SomeShell: Google's Quick Share protocol on the local network (rqs_lib), Bluetooth file push (OBEX) through bluez's obexd as the fallback, and bluez's pairing agent"
license = "GPL-3.0-only"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
# Google's Quick Share protocol (rquickshare's core, GPL-3.0), pinned. Without
# its "experimental" feature: that runs a BLE scan filtered to Quick Share's
# UUID for as long as the helper lives, which kept the adapter "scanning"
# (the Bluetooth page could not stop it) and crashed the tablet's kernel
# (eir_has_uuids, 2026-11-17). The short broadcast that wakes phones while
# sending is done here instead (quick.rs, bluer).
rqs_lib = { git = "https://github.com/Martichou/rquickshare", rev = "378d8ae", default-features = false }
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
