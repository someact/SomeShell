[package]
name = "someshell-share"
version = "0.1.0"
edition = "2021"
description = "Quick Share for SomeShell: Bluetooth file push (OBEX) through bluez's obexd, sending and receiving"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
