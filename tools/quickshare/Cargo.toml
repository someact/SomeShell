[package]
name = "someshell-quickshare"
version = "0.1.0"
edition = "2021"
description = "Headless Quick Share (Nearby Share) helper for SomeShell: JSON lines on stdin and stdout"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Pinned to a commit: this code runs a network service on the user's machine
rqs_lib = { git = "https://github.com/Martichou/rquickshare", rev = "378d8ae969941bee4bf60ad34ac9cf8bb7005eb7", default-features = false }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = "0.7"
base64 = "0.22"
get_if_addrs = "0.5"
# The same fork rqs_lib uses, so it is compiled once
mdns-sd = { git = "https://github.com/Martichou/mdns-sd", branch = "unsolicited" }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "signal", "net", "time"] }

[features]
# The library's Bluetooth side (it listens for nearby senders and advertises
# while searching). Both switch the adapter on, so the shell only runs the
# build with this feature while Bluetooth is on already; scripts/quickshare.sh
# builds one binary with it and one without.
ble = ["rqs_lib/experimental"]

[profile.release]
opt-level = "s"
strip = true
